name: Update OpenCritic Calendar

# Запускается каждый день в 11:30 GMT+5 (6:30 UTC)
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

# 🔥 ДОБАВИТЬ ЭТИ РАЗРЕШЕНИЯ:
permissions:
  contents: write
  actions: read

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Run calendar processor
      run: |
        python calendar-processor.py
    
    - name: Check if file was created
      run: |
        if [ -f "opencritic-calendar-filtered.ics" ]; then
          echo "✅ Календарь успешно создан"
          ls -la opencritic-calendar-filtered.ics
          echo "Размер файла: $(du -h opencritic-calendar-filtered.ics | cut -f1)"
        else
          echo "❌ Ошибка: файл календаря не создан"
          exit 1
        fi
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Добавляем новый календарь
        git add opencritic-calendar-filtered.ics
        
        # Проверяем, есть ли изменения
        if git diff --staged --quiet; then
          echo "Нет изменений в календаре"
        else
          echo "Обнаружены изменения, обновляем календарь"
          git commit -m "🗓️ Автоматическое обновление календаря OpenCritic ($(date '+%Y-%m-%d %H:%M UTC'))"
          git push
        fi
    
    - name: Display calendar info
      run: |
        if [ -f "opencritic-calendar-filtered.ics" ]; then
          echo "📊 Информация о календаре:"
          echo "Размер файла: $(stat --format=%s opencritic-calendar-filtered.ics) байт"
          echo "Количество событий: $(grep -c 'BEGIN:VEVENT' opencritic-calendar-filtered.ics || echo '0')"
          echo ""
          echo "🔗 Ссылка для подключения к Google Calendar:"
          echo "https://maxytre.github.io/opencritic-calendar-optimizer/opencritic-calendar-filtered.ics"
        fi